; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pinned on purpose. "platform = espressif32" is NOT reproducible: PlatformIO
; picks the highest INSTALLED version, so this machine silently built against
; pioarduino 51.03.04 (Arduino core 3.0.4) while a teammate with a clean
; install would get the registry's 6.x (Arduino core 2.x) and hit a completely
; different set of compile errors. Core 3.x is what the ESPAsync* libraries
; below target, so we pin it explicitly for everyone.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32dev
framework = arduino

; The default partition table gives the app 1.31 MB and this sketch already
; fills 84% of it (the vendored nipplejs page is ~27 KB of that, the Wi-Fi +
; async-webserver stack the rest). huge_app gives the app 3 MB by dropping the
; second OTA slot, which this project does not use -- you flash over USB.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESPAsyncWebServer declares an async-TCP backend for every platform it
; supports, so PlatformIO also downloads the ESP8266 one (ESPAsyncTCP) and the
; RP2040 one (RPAsyncTCP). The dependency finder then tries to compile them for
; the ESP32 and the build fails before it reaches src/. AsyncTCP is the correct
; backend for this board; ignore the other two.
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP

lib_deps =
	esp32async/ESPAsyncWebServer@^3.12.0
	esp32async/AsyncTCP@^3.5.0

[platformio]
description = For a RC-Car
